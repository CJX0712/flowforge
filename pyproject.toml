[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowforge"
version = "0.1.0"
description = "World-class normalizing-flow density estimation: RealNVP, MAF and the FlowFuse mixture flagship. Pure NumPy, deterministic, offline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = ["normalizing-flows", "density-estimation", "realnvp", "maf", "generative-models"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
sota = ["torch>=2.0", "nflows>=0.14"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
flowforge = "flowforge.cli:main"

[tool.setuptools]
packages = ["flowforge", "flowforge.core", "flowforge.data", "flowforge.flows",
            "flowforge.training", "flowforge.eval", "flowforge.pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["scratch_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E731", "E741"]

[tool.coverage.run]
source = ["flowforge"]
omit = ["flowforge/examples/*"]
