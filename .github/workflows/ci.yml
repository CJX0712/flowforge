name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Pinned lock file: prevents numpy/scipy version drift from flipping gates.
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests
        run: python -m pytest -q --cov=flowforge --cov-report=term

      - name: Invariant self-check
        run: python -m flowforge.cli selftest

      - name: Demo smoke
        run: python flowforge/examples/run_demo.py --quick
